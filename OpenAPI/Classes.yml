openapi: 3.0.3
info:
  title: Hero Class API
  description: API for managing hero classes in the game
  version: 1.0.0

servers:
  - url: http://localhost:5008
    description: Local development server

tags:
  - name: Class
    description: Hero classes

paths:
  /class:
    get:
      summary: Get all hero classes
      tags:
        - Class
      responses:
        '200':
          description: List of hero classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'

    post:
      summary: Create a new hero class
      tags:
        - Class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassRequest'
      responses:
        '201':
          description: Hero class created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Class name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /class/{id}:
    get:
      summary: Get a hero class by ID
      tags:
        - Class
      parameters:
        - name: id
          in: path
          required: true
          description: Hero class ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Hero class found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
        '404':
          description: Hero class not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Class:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Warrior
        pv:
          type: integer
          example: 150
        gold:
          type: integer
          example: 50
        atk:
          type: integer
          example: 20
      required:
        - id
        - name
        - pv
        - gold
        - atk

    CreateClassRequest:
      type: object
      properties:
        name:
          type: string
          example: Mage
        pv:
          type: integer
          example: 80
        gold:
          type: integer
          example: 100
        atk:
          type: integer
          example: 30
      required:
        - name
        - pv
        - gold
        - atk

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Error message
