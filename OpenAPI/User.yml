openapi: 3.0.3
info:
  title: API Utilisateur
  description: API de gestion des utilisateurs
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Serveur local

paths:
  /user/{id}:
    get:
      summary: Récupérer un utilisateur
      description: Retourne un utilisateur à partir de son identifiant.
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de l'utilisateur
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Utilisateur non trouvé

  /user:
    post:
      summary: Créer un utilisateur
      description: Insère un utilisateur en base et retourne l'utilisateur créé sans le mot de passe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Données invalides

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Jean"
      required:
        - id
        - name

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
          example: "Jean"
        password:
          type: string
          example: "monMotDePasse"
      required:
        - name
        - password
