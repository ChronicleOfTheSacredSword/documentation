openapi: 3.0.3
info:
  title: User API
  description: API for managing users
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Local development server

paths:
  /user/{id}:
    get:
      summary: Get a user by ID
      description: Returns a user if it exists
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of the user
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user:
    post:
      summary: Create a new user
      description: Creates a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid password or bad input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: johndoe
        createdAt:
          type: string
          format: date-time
          example: 2026-02-02T10:15:30Z
      required:
        - id
        - username

    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          example: johndoe
        password:
          type: string
          example: StrongP@ssw0rd
      required:
        - username
        - password

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Invalid User
      required:
        - message
