openapi: 3.0.3
info:
  title: API d'Authentification
  description: API permettant l'authentification des utilisateurs via JWT
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Serveur local

paths:
  /auth:
    post:
      summary: Authentifie un utilisateur
      description: Authentifie l'utilisateur et retourne son objet user ainsi qu'un token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants invalides

  /disconnect:
    post:
      summary: Déconnecte l'utilisateur
      description: Invalide le token JWT de l'utilisateur.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Déconnexion réussie
        '401':
          description: Token invalide ou expiré

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Jean Dupont"
        password:
          type: string
          example: "$2b$10$hashedpassword"
      required:
        - id
        - name
        - password

    AuthRequest:
      type: object
      properties:
        name:
          type: string
          example: "Jean"
        password:
          type: string
          example: "monMotDePasse"
      required:
        - name
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      required:
        - user
        - token
