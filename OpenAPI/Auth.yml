openapi: 3.0.3
info:
  title: Authentication API
  description: JWT-based authentication service
  version: 1.0.0

servers:
  - url: http://localhost:5001
    description: Local auth server

paths:
  /login:
    post:
      summary: Authenticate a user
      description: Logs in a user and returns access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing username or password
        '403':
          description: Invalid credentials

  /token:
    post:
      summary: Refresh access token
      description: Generates a new access token using a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          description: Missing refresh token
        '403':
          description: Invalid or expired refresh token

  /logout/{token}:
    delete:
      summary: Logout user
      description: Invalidates a refresh token by removing it from the server
      parameters:
        - name: token
          in: path
          required: true
          description: Refresh token to invalidate
          schema:
            type: string
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '204':
          description: Logged out successfully

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        name:
          type: string
          example: johndoe
        password:
          type: string
          example: StrongP@ssw0rd
      required:
        - name
        - password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - accessToken
        - refreshToken

    RefreshTokenRequest:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - token

    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - accessToken
